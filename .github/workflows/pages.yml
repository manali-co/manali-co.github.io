name: Publish to GitHub Pages

# Static export of the site on every push to main, published as a redirecting mirror: every Pages
# URL sends the visitor to the same path on manali.page (meta refresh + script), with the static
# page underneath as a fallback. Subscribe, reactions, confirm/unsubscribe and admin live only on
# the Vercel + Azure deployment.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/static-export.mjs
        env:
          # Links, canonical tags, feed ids and social cards all point at the full deployment; the
          # Pages copy is a mirror of the reading experience, not a second home.
          NEXT_PUBLIC_SITE_URL: https://manali.page
          NEXT_PUBLIC_APPINSIGHTS_CONNECTION_STRING: ${{ vars.APPINSIGHTS_CONNECTION_STRING }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
