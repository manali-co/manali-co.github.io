<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100"><defs><linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C2B6B"/><stop offset="1" stop-color="#5B63C7"/></linearGradient></defs><style>
.ridge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.22,.61,.36,1) .2s forwards}
.sun{opacity:0;transform:translateY(12px);animation:rise 1s cubic-bezier(.22,.61,.36,1) 1.1s forwards}
.halo{opacity:0;animation:fade .7s ease-out 1.9s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes rise{to{opacity:1;transform:translateY(0)}}@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ridge,.sun,.halo{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
</style><circle class="halo" cx="68" cy="40" r="19" fill="none" stroke="#FBE7B8" stroke-width="1.5"/><circle class="sun" cx="68" cy="40" r="13" fill="#F2B84B"/><path class="ridge" pathLength="1" d="M6 70 C 18 70, 24 28, 36 28 C 48 28, 50 62, 60 62 C 72 62, 76 46, 94 46" fill="none" stroke="url(#ridge)" stroke-width="3.2" stroke-linecap="round"/></svg>