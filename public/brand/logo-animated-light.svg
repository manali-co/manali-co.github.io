<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 100" width="330" height="100"><defs><linearGradient id="ridge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2C2B6B"/><stop offset="1" stop-color="#5B63C7"/></linearGradient></defs>
<style>
.ridge{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.22,.61,.36,1) .2s forwards}
.sun{opacity:0;transform:translateY(12px);animation:rise 1s cubic-bezier(.22,.61,.36,1) 1.1s forwards}
.halo{opacity:0;animation:fade .7s ease-out 1.9s forwards}
.word{opacity:0;transform:translateY(6px);animation:settle .8s cubic-bezier(.22,.61,.36,1) 2s forwards}
.tag{opacity:0;animation:fade .8s ease-out 2.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes fade{to{opacity:1}}
@keyframes settle{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.ridge,.sun,.halo,.word,.tag{animation:none;opacity:1;transform:none;stroke-dashoffset:0}}
