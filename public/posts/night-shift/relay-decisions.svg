<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1560" viewBox="0 0 1100 1560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="What the relay does with one alert"><title>What the relay does with one alert</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1100" height="1560" fill="#FBFAF7"/><text x="30" y="38" font-size="22" font-weight="700" fill="#1F2433" text-anchor="start">What the relay does with one alert</text><rect x="390" y="70" width="340" height="56" rx="28.0" fill="#EAF2FB" stroke="#1F6FBF" stroke-width="2"/><text x="560.0" y="101.5" font-size="19" font-weight="700" fill="#0F3D6E" text-anchor="middle">Webhook: POST /alerts</text><polyline points="560,126 560,158" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polygon points="560,160.0 710.0,220 560,280.0 410.0,220" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560" y="214.0" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Key valid?</text><text x="560" y="235.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">(constant-time check)</text><rect x="785" y="190" width="290" height="60" rx="12" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="930.0" y="212.75" font-size="19" font-weight="700" fill="#7A1F16" text-anchor="middle">401</text><text x="930.0" y="237.75" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">the email still goes out</text><polyline points="710,220 783,220" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="735" y="210" font-size="15" font-weight="600" fill="#5B6275" text-anchor="middle" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">no</text><polyline points="560,280 560,318" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="572" y="304" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">yes</text><rect x="400" y="320" width="320" height="64" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560.0" y="344.75" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Parse + fingerprint</text><text x="560.0" y="369.75" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">rule · dimensions · targets</text><polyline points="560,384 560,414" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polygon points="560,414.0 720.0,476 560,538.0 400.0,476" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560" y="470.0" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Seen this alert</text><text x="560" y="491.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">and condition?</text><rect x="785" y="446" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="930.0" y="468.75" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Ack as a duplicate</text><text x="930.0" y="493.75" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">Azure retries webhooks</text><polyline points="720,476 783,476" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="745" y="466" font-size="15" font-weight="600" fill="#5B6275" text-anchor="middle" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">yes</text><polyline points="560,538 560,572" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="572" y="560" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">no</text><polygon points="560,574.0 710.0,632 560,690.0 410.0,632" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560" y="626.0" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Fired or</text><text x="560" y="647.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">resolved?</text><rect x="50" y="602" width="280" height="60" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="190.0" y="635.5" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Mark the alert clear</text><polyline points="410,632 332,632" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="371" y="622" font-size="15" font-weight="600" fill="#5B6275" text-anchor="middle" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">resolved</text><polyline points="190,662 190,700" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polygon points="190,702.0 330.0,764 190,826.0 50.0,764" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="190" y="758.0" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Every alert in</text><text x="190" y="779.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">it clear now?</text><rect x="50" y="862" width="280" height="64" rx="12" fill="#E8F5EC" stroke="#3E9C6B" stroke-width="2"/><text x="190.0" y="886.75" font-size="19" font-weight="700" fill="#1E5236" text-anchor="middle">Resolved</text><text x="190.0" y="911.75" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">push: all clear</text><polyline points="190,826 190,860" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="202" y="848" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">yes</text><polyline points="560,690 560,726" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="572" y="714" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">fired</text><polygon points="560,728.0 710.0,788 560,848.0 410.0,788" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560" y="792.5" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Severity?</text><rect x="785" y="712" width="290" height="60" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="930.0" y="734.75" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Sev 4: ignore</text><text x="930.0" y="759.75" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">email only, for now</text><polyline points="710,788 756,788 756,742 783,742" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="785" y="806" width="290" height="84" rx="12" fill="#F0F2F5" stroke="#5A6B7F" stroke-width="2"/><text x="930.0" y="830.0" font-size="19" font-weight="700" fill="#2B3644" text-anchor="middle">Sev 3</text><text x="930.0" y="855.0" font-size="16.5" font-weight="400" fill="#2B3644" text-anchor="middle">join an open incident,</text><text x="930.0" y="876.5" font-size="16.5" font-weight="400" fill="#2B3644" text-anchor="middle">or wait for the digest</text><polyline points="756,788 756,848 783,848" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><polyline points="560,848 560,896" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="572" y="880" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">Sev 1–2</text><polygon points="560,897.0 750.0,972 560,1047.0 370.0,972" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="560" y="955.5" font-size="16.5" font-weight="700" fill="#1F2433" text-anchor="middle">Part of an open incident?</text><text x="560" y="976.5" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">same fingerprint, or</text><text x="560" y="997.5" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">firing in the last 15 min</text><rect x="785" y="1034" width="290" height="84" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="930.0" y="1058.0" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Join it</text><text x="930.0" y="1083.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">repeat push, loud</text><text x="930.0" y="1104.5" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">at most once an hour</text><polyline points="750,972 930,972 930,1032" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="770" y="962" font-size="15" font-weight="600" fill="#5B6275" text-anchor="middle" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">yes</text><polyline points="560,1047 560,1078" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><text x="572" y="1068" font-size="15" font-weight="600" fill="#5B6275" text-anchor="start" paint-order="stroke" stroke="#FBFAF7" stroke-width="6" stroke-linejoin="round">no</text><rect x="400" y="1080" width="320" height="60" rx="12" fill="#EEEFFA" stroke="#5B63C7" stroke-width="2"/><text x="560.0" y="1113.5" font-size="19" font-weight="700" fill="#2C2B6B" text-anchor="middle">Open an incident</text><polyline points="560,1140 560,1170" 