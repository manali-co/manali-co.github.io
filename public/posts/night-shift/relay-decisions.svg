r-end="url(#ah)" stroke-linejoin="round"/><rect x="370" y="1422" width="380" height="56" rx="12" fill="#FBEDE6" stroke="#C8643F" stroke-width="2"/><text x="560.0" y="1453.5" font-size="19" font-weight="700" fill="#6B2E17" text-anchor="middle">Wake Owl (fire the routine)</text><polyline points="560,1478 560,1494" fill="none" stroke="#475569" stroke-width="2.2" marker-end="url(#ah)" stroke-linejoin="round"/><rect x="370" y="1496" width="380" height="50" rx="25.0" fill="#E8F5EC" stroke="#3E9C6B" stroke-width="2"/><text x="560.0" y="1524.5" font-size="19" font-weight="700" fill="#1E5236" text-anchor="middle">Push: Owl is on it</text></svg>