<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="860" viewBox="0 0 1100 860" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" role="img" aria-label="Who can do what"><title>Who can do what</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="ah-s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1100" height="860" fill="#FBFAF7"/><text x="30" y="38" font-size="22" font-weight="700" fill="#1F2433" text-anchor="start">Who can do what</text><rect x="20" y="80" width="330" height="700" rx="16" fill="none" stroke="#C8643F" stroke-width="2" stroke-dasharray="9 6"/><rect x="36" y="67" width="244.0" height="26" rx="6" fill="#FBFAF7"/><rect x="44" y="74" width="12" height="12" rx="3" fill="#C8643F"/><text x="64" y="86" font-size="16" font-weight="700" fill="#C8643F" text-anchor="start">Owl (Claude session)</text><rect x="385" y="80" width="330" height="700" rx="16" fill="none" stroke="#5B63C7" stroke-width="2" stroke-dasharray="9 6"/><rect x="401" y="67" width="97.0" height="26" rx="6" fill="#FBFAF7"/><rect x="409" y="74" width="12" height="12" rx="3" fill="#5B63C7"/><text x="429" y="86" font-size="16" font-weight="700" fill="#5B63C7" text-anchor="start">Relay</text><rect x="750" y="80" width="330" height="700" rx="16" fill="none" stroke="#3E9C6B" stroke-width="2" stroke-dasharray="9 6"/><rect x="766" y="67" width="67.6" height="26" rx="6" fill="#FBFAF7"/><rect x="774" y="74" width="12" height="12" rx="3" fill="#3E9C6B"/><text x="794" y="86" font-size="16" font-weight="700" fill="#3E9C6B" text-anchor="start">Me</text><rect x="40" y="116" width="290" height="236" rx="12" fill="#FBEDE6" stroke="#C8643F" stroke-width="2"/><text x="185.0" y="183.75" font-size="19" font-weight="700" fill="#6B2E17" text-anchor="middle">Holds</text><text x="185.0" y="208.75" font-size="16.5" font-weight="400" fill="#6B2E17" text-anchor="middle">no Azure credentials</text><text x="185.0" y="230.25" font-size="16.5" font-weight="400" fill="#6B2E17" text-anchor="middle">no tokens: the proxy</text><text x="185.0" y="251.75" font-size="16.5" font-weight="400" fill="#6B2E17" text-anchor="middle">adds them on the way out</text><text x="185.0" y="273.25" font-size="16.5" font-weight="400" fill="#6B2E17" text-anchor="middle">a key that opens</text><text x="185.0" y="294.75" font-size="16.5" font-weight="400" fill="#6B2E17" text-anchor="middle">one incident only</text><rect x="40" y="372" width="290" height="196" rx="12" fill="#E8F5EC" stroke="#3E9C6B" stroke-width="2"/><text x="185.0" y="430.5" font-size="19" font-weight="700" fill="#1E5236" text-anchor="middle">Can</text><text x="185.0" y="455.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">read runbooks and code</text><text x="185.0" y="477.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">run read-only queries</text><text x="185.0" y="498.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">post notes on its incident</text><text x="185.0" y="520.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">open a PR to dev</text><rect x="40" y="588" width="290" height="172" rx="12" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="185.0" y="645.25" font-size="19" font-weight="700" fill="#7A1F16" text-anchor="middle">Can&#x27;t</text><text x="185.0" y="670.25" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">merge or deploy</text><text x="185.0" y="691.75" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">run az or touch prod</text><text x="185.0" y="713.25" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">see other incidents</text><rect x="405" y="116" width="290" height="236" rx="12" fill="#EEEFFA" stroke="#5B63C7" stroke-width="2"/><text x="550.0" y="183.75" font-size="19" font-weight="700" fill="#2C2B6B" text-anchor="middle">Holds</text><text x="550.0" y="208.75" font-size="16.5" font-weight="400" fill="#2C2B6B" text-anchor="middle">a managed identity</text><text x="550.0" y="230.25" font-size="16.5" font-weight="400" fill="#2C2B6B" text-anchor="middle">Log Analytics Reader,</text><text x="550.0" y="251.75" font-size="16.5" font-weight="400" fill="#2C2B6B" text-anchor="middle">on three resources</text><text x="550.0" y="273.25" font-size="16.5" font-weight="400" fill="#2C2B6B" text-anchor="middle">Key Vault reads,</text><text x="550.0" y="294.75" font-size="16.5" font-weight="400" fill="#2C2B6B" text-anchor="middle">one secret at a time</text><rect x="405" y="372" width="290" height="196" rx="12" fill="#E8F5EC" stroke="#3E9C6B" stroke-width="2"/><text x="550.0" y="430.5" font-size="19" font-weight="700" fill="#1E5236" text-anchor="middle">Can</text><text x="550.0" y="455.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">read telemetry</text><text x="550.0" y="477.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">write its own table</text><text x="550.0" y="498.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">start sessions (capped)</text><text x="550.0" y="520.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">push to my phone</text><rect x="405" y="588" width="290" height="172" rx="12" fill="#FDECEC" stroke="#C0392B" stroke-width="2"/><text x="550.0" y="645.25" font-size="19" font-weight="700" fill="#7A1F16" text-anchor="middle">Can&#x27;t</text><text x="550.0" y="670.25" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">change any prod resource</text><text x="550.0" y="691.75" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">read a secret it</text><text x="550.0" y="713.25" font-size="16.5" font-weight="400" fill="#7A1F16" text-anchor="middle">wasn&#x27;t granted</text><rect x="770" y="116" width="290" height="236" rx="12" fill="#E8F5EC" stroke="#3E9C6B" stroke-width="2"/><text x="915.0" y="194.5" font-size="19" font-weight="700" fill="#1E5236" text-anchor="middle">Holds</text><text x="915.0" y="219.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">the merge button</text><text x="915.0" y="241.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">the deploy</text><text x="915.0" y="262.5" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">rollbacks, restarts,</text><text x="915.0" y="284.0" font-size="16.5" font-weight="400" fill="#1E5236" text-anchor="middle">scaling, secrets</text><rect x="770" y="372" width="290" height="196" rx="12" fill="#FFFFFF" stroke="#475569" stroke-width="2"/><text x="915.0" y="430.5" font-size="19" font-weight="700" fill="#1F2433" text-anchor="middle">Does</text><text x="915.0" y="455.5" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">reads the diagnosis</text><text x="915.0" y="477.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">answers its questions</text><text x="915.0" y="498.5" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">picks an option</text><text x="915.0" y="520.0" font-size="16.5" font-weight="400" fill="#1F2433" text-anchor="middle">runs the command</text><rect x="770" y="588" width="290" height="172" rx="12" fill="#FDF3DC" stroke="#C98A12" stroke-width="2"/><text x="915.0" y="656.0" font-size="19" font-weight="700" fill="#6B4A07" text-anchor="middle">Rule</text><text x="915.0" y="681.0" font-size="16.5" font-weight="400" fill="#6B4A07" text-anchor="middle">Claude proposes,</text><text x="915.0" y="702.5" font-size="16.5" font-weight="400" fill="#6B4A07" text-anchor="middle">I dispose</text><text x="550" y="820" font-size="15" font-weight="400" fill="#5B6275" text-anchor="middle" font-style="italic">Alert text, log lines and query results can carry user-written text, so the session treats them as data, never as instructions.</text></svg>